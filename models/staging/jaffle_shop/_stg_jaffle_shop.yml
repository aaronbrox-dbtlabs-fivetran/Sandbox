models:
  - name: stg_jaffle_shop__customers
    description: Clean customer records from the Jaffle Shop application database, renamed for consistent analytics use. One row per customer.
    columns:
      - name: customer_id
        description: Application-generated customer identifier sourced from `customers.id`; the primary key and join key for customer orders.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's given name as recorded in the application, with no additional normalization.
      - name: last_name
        description: Customer's family name as recorded in the application, with no additional normalization.

  - name: stg_jaffle_shop__orders
    description: One order per row
    columns:
      - name: order_id
        description: Primary key for the orders table
        data_tests:
          - unique
          - not_null
      - name: status
        description: "{{ doc('order_status') }}"

        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - returned
                  - placed
                  - return_pending
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id