sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    description: A clone of a Postgres application database
    tables:
      - name: customers
        description:  Raw customers data. 
        columns:
          - name: id
            description: Application-generated identifier and primary key for raw customer records.
            data_tests:
              - unique
              - not_null

      - name: orders
        description:  Raw orders data. 
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 1
              period: day
          loaded_at_field: _etl_loaded_at
