sources:
  - name: tpch_now
    description: >
      Synthetic transactional feed used to demonstrate a frequently refreshed order domain.
      The source is treated as the operational record for order headers and line-level activity.
    database: raw_abrox
    schema: tpch_now
    config:
      freshness:
        warn_after:
          count: 1
          period: day
        error_after:
          count: 2
          period: day
    tables:
      - name: lineitem
        description: >
          Order-line activity at one row per order and line number. Each row identifies
          the product and supplier selected for fulfillment and carries line-level pricing,
          status, and delivery dates.
        columns:
          - name: l_orderkey
            description: Foreign key to the order header; forms the line-item grain with `l_linenumber`.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('tpch_now', 'orders')
                    field: o_orderkey
          - name: l_partkey
            description: Product identifier for the item ordered; used to enrich lines with catalog attributes.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('tpch_sf001', 'part')
                    field: p_partkey
          - name: l_suppkey
            description: Supplier selected to fulfill this line; meaningful together with `l_partkey`.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('tpch_sf001', 'supplier')
                    field: s_suppkey
          - name: l_linenumber
            description: One-based line sequence within an order; forms the line-item grain with `l_orderkey`.
            data_tests:
              - not_null
          - name: l_quantity
            description: Number of units ordered from the selected supplier for this line.
          - name: l_extendedprice
            description: Line value before discount and tax, supplied in the demo currency.
          - name: l_discount
            description: Fractional discount rate applied to the extended price; `0.05` represents five percent.
          - name: l_tax
            description: Fractional tax rate applied after discount; `0.08` represents eight percent.
          - name: l_returnflag
            description: 'Return disposition code: `N` not returned, `R` returned, or `A` accepted for return.'
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['A', 'N', 'R']
          - name: l_linestatus
            description: 'Fulfillment state of the line: `O` open or `F` fulfilled.'
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['F', 'O']
          - name: l_shipdate
            description: Date the line was or is expected to be shipped from the supplier.
          - name: l_commitdate
            description: Supplier commitment date used to assess whether fulfillment met the promised schedule.
          - name: l_receiptdate
            description: Date the customer or receiving location recorded delivery of the line.
          - name: l_shipinstruct
            description: Handling instruction passed to fulfillment, such as in-person delivery or return handling.
          - name: l_shipmode
            description: Transportation mode selected for the line, used for fulfillment analysis.
          - name: l_comment
            description: Free-text operational note retained for demonstrations of unstructured source attributes.

      - name: orders
        description: >
          Order headers at one row per order. Header totals and priority attributes are retained
          for reconciliation and operational slicing but should not be summed at order-line grain.
        columns:
          - name: o_orderkey
            description: Stable natural key assigned to an order by the source system.
            data_tests:
              - unique
              - not_null
          - name: o_orderdate
            description: Business date on which the customer placed the order.
          - name: o_ordertime
            description: Demo extension to TPC-H containing the timestamp at which the order was placed.
          - name: o_custkey
            description: Customer identifier retained as a degenerate dimension because customer master data is out of scope.
            data_tests:
              - not_null
          - name: o_orderstatus
            description: 'Header lifecycle code: `O` open, `P` partially fulfilled, or `F` fulfilled.'
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['F', 'O', 'P']
          - name: o_totalprice
            description: Source-calculated total for the whole order; non-additive when repeated across order lines.
            data_tests:
              - not_null
          - name: o_orderpriority
            description: Operational fulfillment priority, ordered from urgent through low priority.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - 1-URGENT
                      - 2-HIGH
                      - 3-MEDIUM
                      - 4-NOT SPECIFIED
                      - 5-LOW
          - name: o_clerk
            description: Source-system clerk identifier used to demonstrate operational ownership analysis.
          - name: o_shippriority
            description: Numeric shipping-priority indicator; zero is valid in the synthetic TPC-H feed.
          - name: o_comment
            description: Free-text order note retained for lineage and exploratory demonstrations.

  - name: tpch_sf001
    description: >
      Synthetic product and supplier reference extract based on TPC-H scale factor 0.01.
      It represents the catalog and sourcing context used to enrich the transactional feed.
    database: raw_abrox
    schema: tpch_sf001
    config:
      freshness:
        warn_after:
          count: 1
          period: day
        error_after:
          count: 2
          period: day
    tables:
      - name: partsupp
        description: >
          Supplier-specific product availability at one row per part and supplier pairing.
          This is the authoritative source for unit supply cost and available inventory.
        columns:
          - name: ps_partkey
            description: Product identifier; forms the sourcing grain with `ps_suppkey`.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('tpch_sf001', 'part')
                    field: p_partkey
          - name: ps_suppkey
            description: Supplier identifier; forms the sourcing grain with `ps_partkey`.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('tpch_sf001', 'supplier')
                    field: s_suppkey
          - name: ps_availqty
            description: Units currently available from the supplier for the associated part.
          - name: ps_supplycost
            description: Supplier-specific unit acquisition cost in the demo currency.
          - name: ps_comment
            description: Free-text note about the supplier-part relationship or sourcing arrangement.

      - name: part
        description: Product catalog at one row per part, including merchandising and packaging attributes.
        columns:
          - name: p_partkey
            description: Stable natural key for a catalog part.
            data_tests:
              - unique
              - not_null
          - name: p_name
            description: Synthetic descriptive product name used for search and grouping demonstrations.
          - name: p_mfgr
            description: Manufacturer label used to roll products into a higher-level maker grouping.
          - name: p_brand
            description: Commercial brand assigned beneath the manufacturer hierarchy.
          - name: p_type
            description: Product classification combining category, finish, and material characteristics.
          - name: p_size
            description: Numeric product-size attribute used for assortment analysis; units are intentionally abstract in TPC-H.
          - name: p_container
            description: Packaging format in which the part is stored and shipped.
          - name: p_retailprice
            description: Catalog reference price in the demo currency, independent of actual order-line value.
          - name: p_comment
            description: Free-text catalog note retained to demonstrate descriptive source attributes.

      - name: supplier
        description: Supplier master at one row per supplier, including contact and account context.
        columns:
          - name: s_suppkey
            description: Stable natural key for a supplier.
            data_tests:
              - unique
              - not_null
          - name: s_name
            description: Display name assigned to the supplier in the synthetic master data.
          - name: s_address
            description: Mailing address retained for demonstrations; not treated as a normalized location dimension.
          - name: s_nationkey
            description: Nation identifier retained as a degenerate dimension because nation reference data is out of scope.
          - name: s_phone
            description: Supplier contact number in the source-system display format.
          - name: s_acctbal
            description: Supplier account balance; negative values represent a payable or credit position and are valid.
          - name: s_comment
            description: Free-text supplier note that may contain operational context in the source system.
